# nRF5340 BLE relay: a transparent byte pump between a Bluetooth LE L2CAP
# connection-oriented channel (no custom GATT) and the inter-chip UART (uart1)
# carrying the nRF9151's 9P /net/aether server.

# --- Bluetooth LE peripheral + L2CAP CoC -----------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="DECTstrous GW"
# Legacy connectable advertising: 9P-over-L2CAP clients (iOS scanner, 9p4z
# l2cap_client) discover the gateway via the 9PIS service UUID, which fits the
# 31-byte legacy AD (flags + 128-bit UUID = 21 B). No extended adv -> no net-core
# controller change, so this rides the app-core dev/fw5340 OTA.
# L2CAP CoC requires the SMP module to be present (BT_L2CAP_DYNAMIC_CHANNEL
# depends on BT_SMP). The link itself is left open (sec_level L1); the 9PIS
# chars and the 9P service need no pairing/bonding (per the gateway brief).
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=n
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
# L2CAP SDU MTU. NCS clamps this to ~65 if pushed past what the ACL buffers allow
# (and treats the clamp as a fatal Kconfig warning), so keep it at 512 -- plenty
# for a /net/aether datagram (~471 B 9P message). The 9PIS transport_info still
# advertises mtu=4096 as the service ceiling; the CoC channel negotiates the real
# MTU (512) at connect, so the client just over-allocates its RX buffer. The RX
# side sets a matching rx.mtu + alloc_buf in 9p4z session_pool_l2cap.
CONFIG_BT_L2CAP_TX_MTU=512
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y

# --- 9P Information Service (9PIS) GATT + PSM ------------------------------
# The 9PIS GATT service lets clients read the PSM/MTU/features and connect with
# zero config; the service UUID is advertised so they can filter on it. PSM
# 0x0080 (=128) is the value clients expect for the 9P L2CAP service.
CONFIG_NINEP_GATT_9PIS=y
CONFIG_NINEP_L2CAP_PSM=0x0080

# --- Inter-chip UART (interrupt-driven) + ring buffer ----------------------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
# GPIO: we drive the 9151's reset line (P1.07) to bring it out of reset at boot.
CONFIG_GPIO=y

# --- USB CDC ACM: surface the nRF9151 console (its uart0 -> our uart0) over USB
# so the host can drive the 9151 shell (dect bands/info/cad) and read mesh logs.
# Descriptors mirror the stock connectivity_bridge so existing host tooling/udev
# rules recognize it (Nordic VID 0x1915 / "Thingy:91 X UART" PID). --------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_MANUFACTURER="Nordic Semiconductor"
CONFIG_USB_DEVICE_PRODUCT="DECT Aether Relay"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x910A
CONFIG_USB_MAX_POWER=250
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=2048
# Composite: 3 CDC ACM ports (9151 console / 9P / 5340 console). More USB
# transfer slots so the 3 endpoints don't exhaust the pool (was flooding
# "usb_transfer: No transfer slot available").
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_USB_MAX_NUM_TRANSFERS=8

# --- 9P server: firmware-as-files over the 2nd USB CDC (Phase 2) -------------
# A 9p4z server on cdc_acm_uart1 exposing an MCUboot DFU node so the host can
# `9p write /dev/fw5340` to self-update the 5340 in situ. Phase 3 adds a client
# link to the 9151 + union_fs to re-export /dev/fw9151 + /net/aether here too.
CONFIG_NINEP=y
CONFIG_NINEP_SERVER=y
# DTR-gated session pool over CDC-ACM: a fresh 9P session (RX state + fid
# namespace) per host open/close, so the server no longer wedges when a stream
# client reconnects. Each session's recv handler runs on a dedicated work queue
# (interrupt-driven RX feeds it), not the UART ISR. Shares fs_ops with the L2CAP
# session pool below for a multi-transport re-export server.
CONFIG_NINEP_SESSION_POOL_UART=y
# Re-export the SAME fw_sysfs over BLE L2CAP CoC as well (PSM RELAY_PSM). Same
# /dev tree, second transport -- 9P's transport-agnostic story, made literal.
# (Depends on BT_L2CAP_DYNAMIC_CHANNEL, already enabled above.)
CONFIG_NINEP_TRANSPORT_L2CAP=y
# --- 9P CLIENT to the 9151 over uart1 (the aggregator link) -----------------
# The 5340 is a 9P client to the 9151's server (its uart0 <-> our uart1), so it
# can re-export the 9151's /dev/firmware as /dev/fw9151. RX uses DEFERRED_RX
# (interrupt ISR -> byte ring -> framer thread), NOT the old POLLING mode: that
# was a lowest-priority busy-poll that got STARVED under BLE+USB+chat load, so it
# missed uart1 RX bytes -> the 9P framing desynced -> the host saw "read failed" /
# one-sided chat / flaky sessions. With DEFERRED_RX the ISR catches every byte
# into the ring (hardware-priority), and only framer-thread lag (absorbed by the
# ring) can ever drop -- the same fix the 9151 side already made. recv_cb still
# runs in thread context (the framer thread), so the condvar-broadcast rule holds.
CONFIG_NINEP_CLIENT=y
CONFIG_NINEP_TRANSPORT_UART=y
CONFIG_NINEP_UART_DEFERRED_RX=y
CONFIG_NINEP_UART_POLLING_STACK_SIZE=8192
# Ring >= one max message (msize 8192) + slack, so a full pipelined reply can be
# absorbed while the framer thread is briefly preempted.
CONFIG_NINEP_UART_DEFERRED_RX_RING_SIZE=12288
CONFIG_NINEP_DFU=y
# Transparent proxy backend: re-export the 9151's dynamic /net/aether datagram
# tree (clone/ctl/data conversations) as a local mount, so host/L2CAP 9P clients
# reach it through the same server that serves /dev/fw9151. Each host fid keeps a
# persistent 1:1 mapping to a 9151 client fid (clone allocates upstream on walk).
CONFIG_NINEP_REMOTE_FS=y
# Async (worker-dispatched) reads: a host read of /net/aether `data` forwards
# over the mesh client and blocks until a datagram arrives; without this it would
# stall the session-pool processing thread (freezing the USB 9P server for other
# requests). The worker runs the forwarding client_read off that thread. Its
# stack must hold ninep_client_read's ~2KB reply buffer, so widen it to 4096.
CONFIG_NINEP_SERVER_ASYNC_READ=y
CONFIG_NINEP_SERVER_ASYNC_READ_WORKERS=4
CONFIG_NINEP_SERVER_ASYNC_READ_STACK=4096
# Headroom: each re-exported /net/aether fid consumes one mesh-client fid (on top
# of the base-path fid + the OTA write fid), so widen the client fid pool.
CONFIG_NINEP_MAX_FIDS=48
# Server-side fid table. The default (32) is exhausted by 9pfuse: macOS holds a
# fid per FUSE-cached inode and re-looks-up files as entry_valid lapses WITHOUT
# ever sending Forget, so held fids accumulate (~1 per read) until Twalk hits
# "cannot allocate newfid" (which 9pfuse surfaces as "Result too large" after
# ~28 reads). Stock `9p` clunks promptly and never gets near this. Give a big
# pool so realistic 9pfuse sessions don't exhaust before macOS reclaims inodes.
CONFIG_NINEP_SERVER_MAX_FIDS=256
CONFIG_NINEP_MAX_MESSAGE_SIZE=8192
# MCUboot image management for DFU (the bootloader itself comes from sysbuild).
CONFIG_IMG_MANAGER=y
# Erase the secondary slot a page at a time as the image streams in, NOT one
# long up-front erase. On nRF53 a flash erase stalls instruction fetch, so the
# whole-slot erase blocked USB for seconds -> the relay fell into MCUboot
# mid-write. Progressive erase also makes flash_img own the (correct) secondary.
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_REBOOT=y

# --- 5340 console -> USB CDC (cdc_acm_uart2); RTT kept as a 2nd log backend --
# Console + log go to cdc_acm_uart2 (chosen zephyr,console). Logs ALSO go to RTT
# as a fallback (DK path + the early boot before USB enumerates). So the relay's
# own log is finally readable over USB -- no DK/RTT required to debug it.
CONFIG_UART_CONSOLE=y
CONFIG_RTT_CONSOLE=n
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG=y
# The interactive shell now owns cdc_acm_uart2 (zephyr,shell-uart), so logs go out
# via the SHELL's log backend (CONFIG_SHELL_LOG_BACKEND, default y) interleaved with
# the prompt. Drop the standalone UART log backend or every line double-prints on
# CDC2. RTT stays as a 2nd backend (J-Link + early boot before the shell is up).
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
# Verbose 9151-link diagnostics (mesh RX deliver / post-Tversion / post-Twalk /
# walk hexdump) are LOG_DBG and compile out at the default INF level. Uncomment
# to bring them back when debugging the uart1 link (see app Kconfig):
# CONFIG_DECT_RELAY_LOG_LEVEL_DBG=y

# Boot-banner app name (default was "My Application"); version comes from VERSION.
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="DECTstrous Relay"
# MCUboot image version so a self-OTA swap is verifiable (current/pending in
# /dev/fw5340); keep in sync with VERSION above.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.38.27+0"

# --- Memfault: coredump + reboot-reason capture, exported over the 5340 console -
# The relay should report to the Memfault fleet, and right now this is how we catch
# the DFU-write crash: Memfault captures a coredump (faulting PC + stack) and the
# reboot reason across the reset. On the next boot, `mflt export` dumps them as
# base64 chunks over this console (cdc2) for offline decode / upload.
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_NCS_PROJECT_KEY=""
CONFIG_MEMFAULT_NCS_FW_TYPE="dect-relay-5340"
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_FW_VERSION="0.3.0"
CONFIG_MEMFAULT_NCS_HW_VERSION="thingy91x"
CONFIG_MEMFAULT_NCS_DEVICE_ID_RUNTIME=y
# RAM-backed coredump survives the warm (fault) reset; reboot reason is read from
# RESETREAS at boot, so it survives even a brownout.
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP=y
# Interactive Zephyr shell + the `mflt` debug shell (provides `mflt export`).
CONFIG_SHELL=y
CONFIG_MEMFAULT_SHELL=y

# --- System ----------------------------------------------------------------
# 9P server TX buffer (NINEP_MAX_MESSAGE_SIZE=8192) is heap-allocated; the
# re-export will add a client too. 16K ENOMEM'd it alongside BT+USB -> give room.
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_MAIN_STACK_SIZE=2048
# DFU-write lockup debug: HW_STACK_PROTECTION guards thread stacks but the
# MSP/ISR stack was unguarded -> an overflow during the deep flash write escalated
# to a CPU lockup (RESETREAS bit4) with no handler/coredump. Guard the main stack
# so it faults (Memfault catches it) instead, and give the 9P work queue room for
# the flash_img -> soc_flash_nrf chain.
CONFIG_MPU_STACK_GUARD=y
CONFIG_NINEP_SESSION_PROC_STACK_SIZE=16384
