# nRF5340 BLE relay: a transparent byte pump between a Bluetooth LE L2CAP
# connection-oriented channel (no custom GATT) and the inter-chip UART (uart1)
# carrying the nRF9151's 9P /net/aether server.

# --- Bluetooth LE peripheral + L2CAP CoC -----------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="DECT Aether Relay"
# L2CAP CoC requires the SMP module to be present (BT_L2CAP_DYNAMIC_CHANNEL
# depends on BT_SMP). The link itself is left open (sec_level L1); auth is at
# the 9P/factotum layer, so no pairing/bonding is required.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=n
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y

# --- Inter-chip UART (interrupt-driven) + ring buffer ----------------------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# --- USB CDC ACM: surface the nRF9151 console (its uart0 -> our uart0) over USB
# so the host can drive the 9151 shell (dect bands/info/cad) and read mesh logs.
# Descriptors mirror the stock connectivity_bridge so existing host tooling/udev
# rules recognize it (Nordic VID 0x1915 / "Thingy:91 X UART" PID). --------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_MANUFACTURER="Nordic Semiconductor"
CONFIG_USB_DEVICE_PRODUCT="DECT Aether Relay"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x910A
CONFIG_USB_MAX_POWER=250
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=2048
# Composite: 3 CDC ACM ports (9151 console / 9P / 5340 console). More USB
# transfer slots so the 3 endpoints don't exhaust the pool (was flooding
# "usb_transfer: No transfer slot available").
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_USB_MAX_NUM_TRANSFERS=8

# --- 9P server: firmware-as-files over the 2nd USB CDC (Phase 2) -------------
# A 9p4z server on cdc_acm_uart1 exposing an MCUboot DFU node so the host can
# `9p write /dev/fw5340` to self-update the 5340 in situ. Phase 3 adds a client
# link to the 9151 + union_fs to re-export /dev/fw9151 + /net/aether here too.
CONFIG_NINEP=y
CONFIG_NINEP_SERVER=y
# DTR-gated session pool over CDC-ACM: a fresh 9P session (RX state + fid
# namespace) per host open/close, so the server no longer wedges when a stream
# client reconnects. Each session's recv handler runs on a dedicated work queue
# (interrupt-driven RX feeds it), not the UART ISR. Shares fs_ops with the
# (future) L2CAP session pool for a multi-transport re-export server.
CONFIG_NINEP_SESSION_POOL_UART=y
CONFIG_NINEP_DFU=y
CONFIG_NINEP_MAX_MESSAGE_SIZE=8192
# MCUboot image management for DFU (the bootloader itself comes from sysbuild).
CONFIG_IMG_MANAGER=y
# Erase the secondary slot a page at a time as the image streams in, NOT one
# long up-front erase. On nRF53 a flash erase stalls instruction fetch, so the
# whole-slot erase blocked USB for seconds -> the relay fell into MCUboot
# mid-write. Progressive erase also makes flash_img own the (correct) secondary.
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_REBOOT=y

# --- 5340 console -> USB CDC (cdc_acm_uart2); RTT kept as a 2nd log backend --
# Console + log go to cdc_acm_uart2 (chosen zephyr,console). Logs ALSO go to RTT
# as a fallback (DK path + the early boot before USB enumerates). So the relay's
# own log is finally readable over USB -- no DK/RTT required to debug it.
CONFIG_UART_CONSOLE=y
CONFIG_RTT_CONSOLE=n
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# --- Memfault: coredump + reboot-reason capture, exported over the 5340 console -
# The relay should report to the Memfault fleet, and right now this is how we catch
# the DFU-write crash: Memfault captures a coredump (faulting PC + stack) and the
# reboot reason across the reset. On the next boot, `mflt export` dumps them as
# base64 chunks over this console (cdc2) for offline decode / upload.
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_NCS_PROJECT_KEY=""
CONFIG_MEMFAULT_NCS_FW_TYPE="dect-relay-5340"
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_FW_VERSION="0.3.0"
CONFIG_MEMFAULT_NCS_HW_VERSION="thingy91x"
CONFIG_MEMFAULT_NCS_DEVICE_ID_RUNTIME=y
# RAM-backed coredump survives the warm (fault) reset; reboot reason is read from
# RESETREAS at boot, so it survives even a brownout.
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP=y
# Interactive Zephyr shell + the `mflt` debug shell (provides `mflt export`).
CONFIG_SHELL=y
CONFIG_MEMFAULT_SHELL=y

# --- System ----------------------------------------------------------------
# 9P server TX buffer (NINEP_MAX_MESSAGE_SIZE=8192) is heap-allocated; the
# re-export will add a client too. 16K ENOMEM'd it alongside BT+USB -> give room.
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_MAIN_STACK_SIZE=2048
# DFU-write lockup debug: HW_STACK_PROTECTION guards thread stacks but the
# MSP/ISR stack was unguarded -> an overflow during the deep flash write escalated
# to a CPU lockup (RESETREAS bit4) with no handler/coredump. Guard the main stack
# so it faults (Memfault catches it) instead, and give the 9P work queue room for
# the flash_img -> soc_flash_nrf chain.
CONFIG_MPU_STACK_GUARD=y
CONFIG_NINEP_SESSION_PROC_STACK_SIZE=16384
