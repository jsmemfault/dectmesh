# nRF5340 net-core BT controller (ipc_radio image): enable extended advertising.
# The app-core host advertises the 9PIS service UUID in an EXTENDED adv PDU; the
# controller must support it or bt_le_ext_adv_create fails ("Controller does not
# support LE_READ_MAX_ADV_DATA_LEN"). BT_CTLR_ADV_EXT depends on BT_EXT_ADV even
# in the controller image, so set both (mirrors nrf central_and_peripheral_hrs).
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y
