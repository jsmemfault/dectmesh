# --- Modem and DECT NR+ PHY ------------------------------------------------
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
CONFIG_MODEM_ANTENNA=n
CONFIG_HWINFO=y

# Non-secure target: build as a non-secure image with TF-M (minimal profile).
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# --- System ----------------------------------------------------------------
CONFIG_FPU=y
CONFIG_ASSERT=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096

# --- Logging and shell -----------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SHELL=y

# --- Memfault --------------------------------------------------------------
CONFIG_MEMFAULT=y

# Paste your project key (Settings -> General in the Memfault app). Required
# only for uploading the exported chunks; collection works without it.
CONFIG_MEMFAULT_NCS_PROJECT_KEY=""

# Device identity shown in the fleet.
CONFIG_MEMFAULT_NCS_DEVICE_ID_RUNTIME=y
CONFIG_MEMFAULT_NCS_FW_TYPE="dect-nrplus-mesh"
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_FW_VERSION="0.1.0"
CONFIG_MEMFAULT_NCS_HW_VERSION="nrf9151dk"

# A DECT NR+ PHY node has no IP stack, so Memfault data cannot be posted over
# HTTP. Disable the HTTP transport and export chunks over the shell instead
# (mflt export), or relay them to a gateway node. See the README.
CONFIG_MEMFAULT_HTTP_ENABLE=n

# Memfault shell: mflt export, mflt test, metrics_dump, get_core, ...
CONFIG_MEMFAULT_SHELL=y

# RAM-backed coredump keeps the example self-contained (no flash partition).
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP=y
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP_SIZE=8192
CONFIG_MEMFAULT_COREDUMP_COLLECT_BSS_REGIONS=y

# Capture firmware logs alongside coredumps and metrics.
CONFIG_MEMFAULT_LOGGING_ENABLE=y

# Short heartbeat interval for the demo. A production fleet typically aggregates
# metrics over a longer interval (for example, 3600 seconds).
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=60

# Built-in stack/heap diagnostics.
CONFIG_MEMFAULT_NCS_STACK_METRICS=y
CONFIG_MEMFAULT_HEAP_STATS=y
