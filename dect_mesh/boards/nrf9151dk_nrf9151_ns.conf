# Board-specific Kconfig for the nRF9151 DK, auto-merged for this board only.
#
# Distinct Memfault software type for the DK build: it is a DIFFERENT binary from
# the Thingy:91 X build (different board memory map + drivers), so its coredumps
# must symbolicate against the DK's own ELF. Memfault keys symbols on
# (software_type, version); sharing the Thingy's type would collide and
# mis-symbolicate. A distinct type keeps the DK's symbols separate -- and lets the
# fleet view tell DK nodes from Thingy nodes.
CONFIG_MEMFAULT_NCS_FW_TYPE="dect-nrplus-mesh-dk"
