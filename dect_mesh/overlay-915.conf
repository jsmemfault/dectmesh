# DECT NR+ PHY on the US 915 MHz ISM band (band 4) instead of ~1.9 GHz (band 9).
#
#   west build ... --sysbuild -- -Ddect_mesh_EXTRA_CONF_FILE=overlay-915.conf
#
# Channel center frequency (verified: band 1 carrier 1657 -> 1881.792 MHz edge):
#   Fc[MHz] = 450.144 + carrier * 0.864
#
# The modem (mfw-nr+-phy 2.0.0) reports its supported bands via `dect bands`:
#   band 4   group 1 (~1 GHz)  carriers 525-551  -> 903.744-926.208 MHz  pwr class 3
#   band 1/2/9/22            group 0 (~2 GHz)  carriers 1657-1711  ~1.88-1.93 GHz
#
# IMPORTANT: band 22 is NOT 915 MHz on this modem -- it is group 0, carriers
# 1691-1711 ~= 1911-1928 MHz. The sub-GHz / 915 band is *band 4* (group 1).
# CONFIG_AETHER_DECT_BAND_GROUP=1 selects the ~1 GHz group (band 4); the carrier
# MUST be in 525-551 or the modem rejects every TX with UNSUPPORTED_CARRIER
# (0x6000) -- which is exactly what carrier 1701 (a group-0 carrier) did.
#   carrier 525 -> 903.744 MHz   538 -> 914.976 MHz (~915)   551 -> 926.208 MHz
#
# !! GATE BEFORE TRANSMITTING !!
#   1. DONE 2026-06-02: `dect bands` + Nordic docs confirm band 4 = group 1,
#      carriers 525-551, power class 3 (19 dBm max), band_group_index=1.
#   2. Verify the carrier's ACTUAL center with the RTL-SDR. The 538~=915.0 MHz
#      figure is my ETSI-formula extrapolation (Fc=450.144+n*0.864); the exact
#      mapping is modem-internal (ETSI TS 103 636-2 ch 5.2) -- measure, don't trust.
#   3. REGULATORY: Nordic classifies band 4 as **R&D-EVALUATION ONLY** (nRF9151
#      LACA A0/A1; A0AB to be qualified) and warns its 525-551 carriers INTERFERE
#      WITH LTE/cellular. Nordic's DECT PHY docs cite 47 CFR Part 15.323 (US), NOT
#      15.247 -- so this is a bench/experimentation band, not a clean 902-928 ISM
#      deployment channel. Confirm the real regime + keep power low before non-bench TX.

CONFIG_AETHER_DECT_BAND_GROUP=1
CONFIG_AETHER_DECT_CARRIER=538

# Band 4 is power class 3 (vs class 2 for the ~2 GHz bands). Left at the prj.conf
# default index 10 until the RTL-SDR check + FCC EIRP budget are confirmed.
# CONFIG_AETHER_DECT_TX_POWER=...
