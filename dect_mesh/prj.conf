# DECT NR+ PHY mesh demo application — the Æther/HONR self-organizing mesh (from the
# aephyr module) plus a /net/aether 9P gateway. Memfault and the nRF5340 BLE
# L2CAP<->UART relay are added on top (sysbuild) as follow-on layers.

# --- System ----------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_FPU=y
CONFIG_ASSERT=y
# Larger heap: the 9P server allocates its RX/TX message buffers from it.
CONFIG_HEAP_MEM_POOL_SIZE=49152

# --- Networking core + custom L2 -------------------------------------------
# Custom HeyMac L2 (not IP-routed), but net_pkt needs a packet protocol, so
# keep IPv6 selected and silence its housekeeping to save DECT airtime.
CONFIG_NETWORKING=y
CONFIG_NET_L2_CUSTOM=y
CONFIG_NET_IPV6_ND=n
CONFIG_NET_IPV6_DAD=n
CONFIG_NET_IPV6_MLD=n
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
# Hold a whole DECT NR+ frame in ONE net_buf so the mesh RX payload is contiguous
# (aether_mesh_recv reads pkt->buffer->data directly). The Zephyr default of 128
# chained a >128-byte frame across net_bufs and the RX path saw only the first --
# fine for sub-128 LoRa frames, broken for DECT's larger payloads. Match the
# 512-byte tx_frame_buf / max transport block.
CONFIG_NET_BUF_DATA_SIZE=512

# --- Æther/HeyMac mesh (aephyr) with HONR structured routing ---------------
CONFIG_NET_L2_HEYMAC=y
CONFIG_AETHER_MESH=y
CONFIG_AETHER_ROUTING_HONR=y

# --- DECT NR+ PHY driver (US band 9 = 1920-1930 MHz, 47 CFR 15.323) --------
CONFIG_AETHER_DECT=y
CONFIG_AETHER_DECT_CARRIER=1711
CONFIG_AETHER_DECT_TX_POWER=10
CONFIG_AETHER_DECT_MCS=1
CONFIG_AETHER_DECT_TX_QUEUE_SIZE=8

# --- DECT NR+ PHY modem ----------------------------------------------------
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
CONFIG_MODEM_ANTENNA=n
CONFIG_HWINFO=y
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# --- Shell (app registers 'aether'; driver registers 'dect') ---------------
CONFIG_SHELL=y
CONFIG_AETHER_SHELL=n
CONFIG_DEVICE_SHELL=y

# --- 9P: expose the mesh as /net/aether over UART --------------------------
# The transport UART is selected by the zephyr,ninep-uart chosen node in
# app.overlay; the nRF5340 relays it to BLE L2CAP for clients.
CONFIG_NINEP=y
CONFIG_NINEP_SERVER=y
CONFIG_NINEP_TRANSPORT_UART=y
# 9P server RX: interrupt-driven, with the handlers run on a dedicated off-ISR
# thread (NINEP_UART_DEFERRED_RX). The old lowest-priority busy-poll got starved
# by the DECT mesh (esp. while scanning for a peer) -> tens-of-seconds reply
# latency -> client timeouts. Deferred-RX keeps the control plane responsive
# regardless of mesh load, and runs the stack-heavy /dev/firmware DFU path
# (flash_img / boot_read_bank_header on the external QSPI) off the ISR.
CONFIG_NINEP_UART_DEFERRED_RX=y
# NOTE on 9P-vs-mesh scheduling under load: the framer + async-read workers are
# PREEMPT(6/7) and the mesh RX workq is COOP(2). Under a heavy frame burst the mesh
# workq monopolizes (Zephyr COOP is never preempted, and the workq runs queued
# items back-to-back WITHOUT yielding), so the 9P threads can be starved -> slow
# rxq drain. Tried COOP(1)=-15 (above the mesh): it fixed the root node but STARVED
# the busy child node's mesh -> its 9P server stopped answering Tversion. A
# priority tweak alone can't balance this; the real fix is a k_yield in the mesh RX
# handler between frames (aephyr) so the 9P (at equal COOP) interleaves. Reverted to
# default priorities here; the rxq depth bump (aether_net.c) stays and absorbs bursts.
# The processing thread's stack -- the DFU/flash path needs real room (the old
# 1024 overflowed: UFSR.STKOF usage fault -> reset).
CONFIG_NINEP_UART_POLLING_STACK_SIZE=8192
CONFIG_NINEP_MAX_MESSAGE_SIZE=8192
CONFIG_NINEP_MAX_FIDS=32
CONFIG_NINEP_MAX_TAGS=16
CONFIG_NINEP_SERVER_MAX_FIDS=32
# Async (worker-dispatched) blocking reads: the /net/aether `data` read blocks
# until a datagram arrives; without this it would freeze the single deferred-RX
# processing thread (and the whole 9P server) for every other request. Each of N
# workers serves one concurrently-blocked conversation read.
CONFIG_NINEP_SERVER_ASYNC_READ=y
CONFIG_NINEP_SERVER_ASYNC_READ_WORKERS=4
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- /dev/firmware: this 9151's own MCUboot DFU over 9P ---------------------
# ninep_dfu streams a signed image into the MCUboot secondary slot (which on the
# Thingy:91 X lives in the external GD25LE255E QSPI flash; PM already places it
# there). Re-exported by the 5340 as /dev/fw9151. The external SPI-NOR driver
# (CONFIG_SPI_NOR) is already on for the secondary slot.
CONFIG_NINEP_DFU=y
CONFIG_IMG_MANAGER=y
# MCUboot image version stamped into the signed image header (what /dev/fw9151
# reports as "current"/"pending"). Bump this to make an OTA swap verifiable --
# the VERSION file only drives the boot banner, not the signing version.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.7.33+0"

# Boot-banner app name (default was "My Application"). Keep the VERSION file in
# sync with SIGN_VERSION above so the banner version matches the OTA image.
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="DECTstrous Mesh"
# Progressive (page-at-a-time) erase of the secondary slot during streaming,
# not one long up-front erase — keeps USB/BLE alive and feeds watchdogs. On the
# 9151 the secondary is external QSPI flash, where this matters even more.
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_REBOOT=y

# --- Memfault: report mesh health to the fleet -----------------------------
# Collection works without a key; paste your project key to upload chunks.
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_NCS_PROJECT_KEY=""
CONFIG_MEMFAULT_NCS_DEVICE_ID_RUNTIME=y
CONFIG_MEMFAULT_NCS_FW_TYPE="dect-nrplus-mesh"
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_FW_VERSION="0.2.0"
CONFIG_MEMFAULT_NCS_HW_VERSION="thingy91x"
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=60

# --- Logging ---------------------------------------------------------------
CONFIG_LOG=y
CONFIG_NET_L2_HEYMAC_LOG_LEVEL=3
CONFIG_AETHER_MESH_LOG_LEVEL=3
CONFIG_AETHER_DECT_LOG_LEVEL=3
# 9P server/DFU at WARNING, not INFO. At INFO the server logs every message
# ("Received 9P message", Twalk/Topen/Rclunk); during a 276 KB OTA that floods
# uart0 -> the 5340 console bridge -> CDC. If nothing drains that CDC, the path
# back-pressures and stalls the 9151's 9P server mid-OTA (Tversion -116, only a
# power-cycle recovers it). Silencing the per-message logs keeps the OTA from
# ever flooding the console, so it no longer depends on a console reader.
CONFIG_NINEP_LOG_LEVEL_WRN=y
